<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: rgb(48, 46, 46);
    }
    h1{
        color: rgb(108, 97, 169);
    }
    p{
        color: rgb(129, 228, 255);
    }
    </style> 
</head>
<body>
    <h1 id="titulo">Hola</h1>
    <button id="btnCambiar">Cambiar texto</button>
<script>
    const titulo = document.getElementById("titulo");
    const boton = document.getElementById("btnCambiar");
    boton.addEventListener("click", () => {
    titulo.textContent = "Just Izumi";
    titulo.style.color = "green";
    titulo.style.fontSize = "30px";
});
</script>
    <ul id="lista"></ul>
<button id="btnAgregar">Agregar elemento</button>
<script>
    const lista = document.getElementById("lista");
    const botoon = document.getElementById("btnAgregar");
    botoon.addEventListener("click", () => {
    const li = document.createElement("li"); // crea un nuevo <li>
    li.textContent = "Just Izumi"; // agrega texto al <li>
    li.style.color = "red";
    lista.appendChild(li); // inserta el <li> dentro del <ul>
});
</script>
    <button id="btn">Haz clic aquí</button>
<script>
    const botooon = document.getElementById("btn");
    botooon.addEventListener("click", () => {
    console.log("Se hizo clic");
    alert("¡Just Izumi!");
    });
</script>
    <h1>Presiona una tecla</h1>
    <p id="resultado"></p>
<script>
    const resultado = document.getElementById("resultado");
    document.addEventListener("keydown", (evento) => {
    console.log("Tecla:", evento.key); // se ve en consola
    alert("Just Izumi...");
    resultado.textContent = "Presionaste: " + evento.key; // se ve en la página
    });
</script>
    <form id="formulario">
    <input id="nombre" type="text" />
    <button type="submit">Guardar</button>
    </form>
    <script>
    const formulario = document.getElementById("formulario");
    formulario.addEventListener("submit", (evento) => {
    evento.preventDefault(); // evita que la página se recargue
    const nombre = document.getElementById("nombre").value; // obtiene el valor del input
    alert("Just Izumi!");
    console.log("Nombre:", nombre); // muestra el dato en consola
    });
</script>
</body>
</html>
